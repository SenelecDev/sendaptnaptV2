services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 48
        GROUP_ID: 48
    container_name: sendaptnapt_app_staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - app_staging_storage:/var/www/html/storage/app
      - app_staging_logs:/var/www/html/storage/logs
      - app_staging_framework:/var/www/html/storage/framework
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${STAGING_DB_DATABASE:-sendaptnapt_staging}
      - DB_USERNAME=${STAGING_DB_USERNAME:-sendaptnapt}
      - DB_PASSWORD=${STAGING_DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sendaptnapt_staging_network

  nginx:
    image: nginx:alpine
    container_name: sendaptnapt_nginx_staging
    restart: unless-stopped
    ports:
      - "${STAGING_APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - app_staging_storage:/var/www/html/storage/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - sendaptnapt_staging_network

  postgres:
    image: postgres:15-alpine
    container_name: sendaptnapt_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB_DATABASE:-sendaptnapt_staging}
      POSTGRES_USER: ${STAGING_DB_USERNAME:-sendaptnapt}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "${STAGING_DB_PORT:-5434}:5432"
    networks:
      - sendaptnapt_staging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USERNAME:-sendaptnapt} -d ${STAGING_DB_DATABASE:-sendaptnapt_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sendaptnapt_redis_staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${STAGING_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - sendaptnapt_staging_network

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  app_staging_storage:
    driver: local
  app_staging_logs:
    driver: local
  app_staging_framework:
    driver: local
  staging_nginx_logs:
    driver: local

networks:
  sendaptnapt_staging_network:
    driver: bridge

