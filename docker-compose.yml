# ==============================================
# SENDAPTNAPT - Docker Compose Production
# Services: App, Nginx, PostgreSQL, Redis
# ==============================================

services:
  # ===================
  # Application Laravel
  # ===================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 48
        GROUP_ID: 48
    container_name: sendaptnapt_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # Volumes persistants
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sendaptnapt}
      - DB_USERNAME=${DB_USERNAME:-sendaptnapt}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sendaptnapt_network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Nginx Web Server
  # ===================
  nginx:
    image: nginx:alpine
    container_name: sendaptnapt_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      # Logs Nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - sendaptnapt_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:15-alpine
    container_name: sendaptnapt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sendaptnapt}
      POSTGRES_USER: ${DB_USERNAME:-sendaptnapt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script d'initialisation (optionnel)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - sendaptnapt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sendaptnapt} -d ${DB_DATABASE:-sendaptnapt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Redis Cache
  # ===================
  redis:
    image: redis:7-alpine
    container_name: sendaptnapt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Pas d'exposition du port : Redis accessible uniquement via le réseau Docker (app, queue, scheduler)
    networks:
      - sendaptnapt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Queue Worker (optionnel - désactivé par défaut si problèmes)
  # Lancer avec: docker compose --profile queue up -d
  # ===================
  queue:
    profiles:
      - queue
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendaptnapt_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --verbose
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sendaptnapt}
      - DB_USERNAME=${DB_USERNAME:-sendaptnapt}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - sendaptnapt_network

  # ===================
  # Scheduler (Cron)
  # ===================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendaptnapt_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE:-sendaptnapt}
      - DB_USERNAME=${DB_USERNAME:-sendaptnapt}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    depends_on:
      - app
      - postgres
    networks:
      - sendaptnapt_network

# ===================
# Volumes persistants
# ===================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local

# ===================
# Réseau
# ===================
networks:
  sendaptnapt_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
