# ==============================================
# SENDAPTNAPT - Docker Compose Développement
# Usage: docker-compose -f docker-compose.dev.yml up -d
# ==============================================

version: '3.8'

services:
  # Application (dev mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 48
        GROUP_ID: 48
    container_name: sendaptnapt_app_dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sendaptnapt
      - DB_USERNAME=sendaptnapt
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    depends_on:
      - postgres
      - redis
    networks:
      - sendaptnapt_dev

  nginx:
    image: nginx:alpine
    container_name: sendaptnapt_nginx_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sendaptnapt_dev

  postgres:
    image: postgres:15-alpine
    container_name: sendaptnapt_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sendaptnapt
      POSTGRES_USER: sendaptnapt
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - sendaptnapt_dev

  redis:
    image: redis:7-alpine
    container_name: sendaptnapt_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - sendaptnapt_dev

  # pgAdmin pour visualiser la BDD (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sendaptnapt_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@senelec.sn
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - sendaptnapt_dev

volumes:
  postgres_dev_data:

networks:
  sendaptnapt_dev:
    driver: bridge
