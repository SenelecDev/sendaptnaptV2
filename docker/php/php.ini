; ==============================================
; SENDAPTNAPT - Configuration PHP Production
; ==============================================

[PHP]
; Mémoire et temps d'exécution
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; Uploads
upload_max_filesize = 50M
post_max_size = 55M
file_uploads = On

; Erreurs (désactivé en production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/www/html/storage/logs/php_errors.log

; Sessions
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; Sécurité
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
; Laravel nécessite proc_open (package:discover, Process, queue) et curl (HTTP client)
disable_functions = exec,passthru,shell_exec,system,parse_ini_file,show_source

; Timezone
date.timezone = Africa/Dakar

; Realpath cache (améliore les performances)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

[mbstring]
mbstring.language = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8

[pdo_pgsql]
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_persistent = -1
pgsql.max_links = -1
