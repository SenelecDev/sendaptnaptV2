; ==============================================
; SENDAPTNAPT - PHP-FPM Pool Configuration
; ==============================================

[www]
; Utilisateur et groupe
user = www
group = www

; Socket ou TCP
listen = 0.0.0.0:9000
listen.owner = www
listen.group = www
listen.mode = 0660

; Gestion des processus
; static: nombre fixe de workers
; dynamic: ajuste selon la charge
; ondemand: crée les workers à la demande
pm = dynamic

; Nombre max de processus enfants
pm.max_children = 50

; Nombre de processus au démarrage (mode dynamic)
pm.start_servers = 5

; Nombre min de processus idle
pm.min_spare_servers = 5

; Nombre max de processus idle
pm.max_spare_servers = 35

; Nombre de requêtes avant recycler un worker
pm.max_requests = 500

; Timeout pour le démarrage des workers
pm.process_idle_timeout = 10s

; Status page (utile pour monitoring)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Logging
access.log = /var/www/html/storage/logs/php-fpm-access.log
slowlog = /var/www/html/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 5s

; Limites
request_terminate_timeout = 300s
rlimit_files = 131072
rlimit_core = unlimited

; Variables d'environnement (pour Laravel)
clear_env = no
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[DB_CONNECTION] = $DB_CONNECTION
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_DATABASE] = $DB_DATABASE
env[DB_USERNAME] = $DB_USERNAME
env[DB_PASSWORD] = $DB_PASSWORD
env[REDIS_HOST] = $REDIS_HOST
env[REDIS_PORT] = $REDIS_PORT

; Capture des erreurs
catch_workers_output = yes
decorate_workers_output = no
