; ==============================================
; SENDAPTNAPT - OPcache Configuration
; Optimisé pour Laravel en production
; ==============================================

[opcache]
opcache.enable=1
opcache.enable_cli=1

; Mémoire pour le cache bytecode
opcache.memory_consumption=256

; Mémoire pour les chaînes internées
opcache.interned_strings_buffer=16

; Nombre max de fichiers en cache
opcache.max_accelerated_files=20000

; En production: désactiver la vérification des timestamps
; Les fichiers PHP ne sont pas rechargés automatiquement
; Exécuter php artisan opcache:clear après chaque déploiement
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Garder les commentaires (nécessaire pour les annotations)
opcache.save_comments=1

; Optimisations supplémentaires
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.max_wasted_percentage=10

; JIT (PHP 8.x) - décommenter pour activer
; opcache.jit=1255
; opcache.jit_buffer_size=128M
